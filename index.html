<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORA</title>

    <!-- The app is dark-themed throughout (src/theme.js) — without this,
         browsers render native form controls (select dropdown popups,
         checkboxes, date pickers, scrollbars) with their light-mode
         defaults regardless of any inline styling on the control itself,
         showing up as stray white rectangles against the dark UI. -->
    <meta name="color-scheme" content="dark" />

    <!-- docs/scope-offline-capability.md Phase 4: PWA shell -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FORA" />

    <!-- Same type pairing as website/*.html: Inter (body) + Space Grotesk
         (headings/numerals) — see src/theme.js for why. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

const chips=document.getElementById('chips'),main=document.getElementById('main');
let active='All',q='';
const mk=(t,n)=>{const b=document.createElement('button');b.className='chip';b.textContent=t+(n!==undefined?' ('+n+')':'');b.setAttribute('aria-pressed',String(active===t));b.onclick=()=>{active=t;render()};return b};
function render(){
 chips.innerHTML='';chips.appendChild(mk('All',DATA.items.length));
 DATA.sections.forEach(s=>chips.appendChild(mk(s,DATA.items.filter(i=>i.sec===s).length)));
 const sb=document.createElement('input');sb.type='search';sb.placeholder='Search';sb.value=q;sb.oninput=e=>{q=e.target.value.toLowerCase();renderMain()};chips.appendChild(sb);
 renderMain();
}
function renderMain(){
 main.innerHTML='';
 const secs=DATA.sections.filter(s=>active==='All'||active===s);
 let any=false;
 secs.forEach(s=>{
  const items=DATA.items.filter(i=>i.sec===s&&(!q||(i.title+' '+i.desc).toLowerCase().includes(q)));
  if(!items.length)return;any=true;
  const h=document.createElement('h2');h.innerHTML=s+' <small>'+items.length+' images</small>';main.appendChild(h);
  const g=document.createElement('div');g.className='grid';
  items.forEach(i=>{
   const c=document.createElement('button');c.className='card'+(i.h/i.w>1.3?' tall':'');
   c.innerHTML='<div class="t"><img loading="lazy" src="'+i.thumb+'" alt="'+i.title.replace(/"/g,'')+'"></div><div class="m"><b>'+i.title+'</b><span>'+(i.desc||'')+'</span></div>';
   c.onclick=()=>open(i);g.appendChild(c);
  });
  main.appendChild(g);
 });
 if(!any){main.innerHTML='<div class="empty">Nothing matches.</div>'}
}
const dlg=document.getElementById('dlg');
function open(i){document.getElementById('lt').textContent=i.title;document.getElementById('ld').textContent=i.desc||'';const im=document.getElementById('li');im.src=i.full;im.alt=i.title;const a=document.getElementById('ldl');a.href=i.full;a.setAttribute('download',i.full.split('/').pop());dlg.showModal()}
document.getElementById('lc').onclick=()=>dlg.close();dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
render();
</script></body></html>
